controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    # Controllers to load
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# Configuration for differential drive controller (4-wheel skid steer)
diff_drive_controller:
  ros__parameters:
    # Wheel configuration - grouping your 4 wheels into left/right sides
    left_wheel_names: ["wheel_front_left_joint", "wheel_back_left_joint"]
    right_wheel_names: ["wheel_front_right_joint", "wheel_back_right_joint"]
    
    # Robot physical parameters (from your URDF dimensions)
    wheel_separation: 0.5604    # Distance between left and right wheels (your URDF)
    wheel_radius: 0.1           # Estimated wheel radius
    
    # Control parameters
    publish_rate: 50.0
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    
    # Enable odometry
    enable_odom_tf: true
    open_loop: true
    
    # Velocity limits (matching safety criteria)
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 2.0        #  safety requirement: max 2.0 m/s
        min_velocity: -2.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.57       # Adjust 
        min_velocity: -1.57

    # Command timeout
    cmd_vel_timeout: 0.5
    
    # Covariance
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

# Joint state broadcaster (publishes joint states)
joint_state_broadcaster:
  ros__parameters:
    {}
